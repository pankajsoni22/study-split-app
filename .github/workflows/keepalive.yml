# Supabase pauses free projects after ~7 days without database activity. This calls the tiny
# public.ping() function every 3 days. NOTE: GitHub disables scheduled workflows after 60 days
# without repository activity — keep a second pinger (e.g. cron-job.org) as described in README.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call ping()
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Set the VITE_SUPABASE_URL repository variable"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
