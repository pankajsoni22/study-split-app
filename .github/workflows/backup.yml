# Weekly database backup (Supabase Free has no automatic backups).
# The dump is ENCRYPTED with age before upload: artifacts of a public repo can be downloaded by anyone
# signed in to GitHub. Only the holder of the age private key can read it. Kept for 90 days.
# Setup and restore: docs/02-setup-checklist.md step 7.
name: Backup database

on:
  schedule:
    - cron: '41 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same Supabase CLI version as package.json (run with npx: no extra action, no Node 20 warning).
  SUPABASE_CLI: supabase@3.4.0

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Check settings and connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}          # Session pooler connection string (secret)
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}           # age public key, e.g. age1…
        run: |
          # Plain-language errors (shown as annotations). The password itself is never printed.
          fail() { echo "::error title=Backup setup::$1"; exit 1; }
          test -n "$AGE_RECIPIENT"   || fail "The BACKUP_AGE_RECIPIENT variable is missing (Settings → Secrets and variables → Actions → Variables)."
          [[ "$AGE_RECIPIENT" == age1* ]] || fail "BACKUP_AGE_RECIPIENT must be the public key starting with age1… (not the AGE-SECRET-KEY line)."
          test -n "$SUPABASE_DB_URL" || fail "The SUPABASE_DB_URL secret is missing (Settings → Secrets and variables → Actions → Secrets)."
          url="$SUPABASE_DB_URL"
          [[ "$url" =~ ^postgres(ql)?:// ]] || fail "SUPABASE_DB_URL must start with postgresql:// (copy the URI from Supabase → Connect → Session pooler)."
          [[ "$url" != *YOUR-PASSWORD* && "$url" != *"["* && "$url" != *"]"* ]] || fail "SUPABASE_DB_URL still contains [YOUR-PASSWORD] or square brackets. Replace [YOUR-PASSWORD], brackets included, with the database password."
          [[ "$url" != *" "* ]] || fail "SUPABASE_DB_URL contains a space. Paste it again without spaces or line breaks."
          after_scheme="${url#*://}"; userinfo="${after_scheme%@*}"
          [[ "$userinfo" != *"@"* ]] || fail "The database password contains '@'. Write it as %40 in SUPABASE_DB_URL (or reset the password to letters and numbers only)."
          host=$(python3 -c 'import os,urllib.parse as u; print(u.urlsplit(os.environ["SUPABASE_DB_URL"]).hostname or "")' 2>/dev/null) \
            || fail "SUPABASE_DB_URL can't be read as an address. If the password has symbols (# / : ? %), encode them (# → %23, / → %2F, : → %3A, ? → %3F, % → %25) or reset it to letters and numbers."
          port=$(python3 -c 'import os,urllib.parse as u; print(u.urlsplit(os.environ["SUPABASE_DB_URL"]).port or 5432)' 2>/dev/null) \
            || fail "SUPABASE_DB_URL has an invalid port. If the password has symbols (# / : ?), encode them or reset it to letters and numbers."
          [[ "$host" != db.*.supabase.co ]] || fail "SUPABASE_DB_URL is the 'Direct connection' (IPv6 only; GitHub can't reach it). Use Supabase → Connect → Session pooler instead."
          [[ "$port" != 6543 ]] || fail "SUPABASE_DB_URL uses port 6543 (Transaction pooler). Use the Session pooler string (port 5432)."
          echo "Connecting to $host:$port …"
          if ! out=$(psql "$url" -tAc 'select 1' 2>&1); then
            out=$(echo "$out" | tr '\n' ' ' | cut -c1-300)
            case "$out" in
              *"password authentication failed"*) fail "Wrong database password in SUPABASE_DB_URL. (Reset it in Supabase → Project Settings → Database if unsure.) Details: $out";;
              *"Tenant or user not found"*)       fail "The user name in SUPABASE_DB_URL doesn't match this pooler; for the Session pooler it must be postgres.<project-ref>. Copy the string again from Connect. Details: $out";;
              *)                                  fail "Could not connect with SUPABASE_DB_URL. Details: $out";;
            esac
          fi
          echo "Connection OK"

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
        run: |
          umask 077
          mkdir -p backup
          dump() {
            if ! out=$(npx --yes "$SUPABASE_CLI" db dump --db-url "$SUPABASE_DB_URL" "$@" < /dev/null 2>&1); then
              echo "$out"
              echo "::error title=Backup dump::supabase db dump $* failed: $(echo "$out" | tail -5 | tr '\n' ' ' | cut -c1-400)"
              exit 1
            fi
          }
          dump -f backup/roles.sql --role-only
          dump -f backup/schema.sql
          dump -f backup/data.sql --use-copy --data-only
          stamp=$(date -u +%Y-%m-%d)
          tar -czf - backup | age -r "$AGE_RECIPIENT" -o "study-split-db-$stamp.tar.gz.age"
          rm -rf backup
          ls -la study-split-db-*.tar.gz.age

      - uses: actions/upload-artifact@v7
        with:
          name: db-backup
          path: study-split-db-*.tar.gz.age
          retention-days: 90
          if-no-files-found: error
